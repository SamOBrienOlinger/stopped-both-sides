name: Post-merge live Pages Garda verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live:
    if: github.head_ref == 'qa/verify-merged-garda-pages-20261114'
    name: Live Pages — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BASE_URL: https://samobrienolinger.github.io/stopped-both-sides/
      PAGES_COMMIT: fdbf6ef4fcf045c6e48d55fbc78d9a80410529e9
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify QA branch is only the merged source plus this workflow
        run: |
          echo "Live QA HEAD $(git rev-parse HEAD)"
          echo "Source release $(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD^)" = "$PAGES_COMMIT"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/live-pages-garda-qa.yml"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check all published HTML, JS, CSS and images against the merge
        run: node tests/browser/wait-for-pages.mjs
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test live artwork, character switching, scenes, captions and RTL
        run: npm run test:browser -- --project=${{ matrix.browser }} tests/browser/garda-baseball.spec.mjs tests/browser/approved-backgrounds.spec.mjs tests/browser/site-polish.spec.mjs tests/browser/scenes.spec.mjs tests/browser/turn-headshot.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: live-garda-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
