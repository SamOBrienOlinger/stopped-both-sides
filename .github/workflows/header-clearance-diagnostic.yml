name: Header clearance diagnostics
on:
  push:
    branches: [diagnostic/header-clearance-20261123]
permissions:
  contents: read
jobs:
  clearance:
    name: Header and arrest-card baseline (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify unchanged published application
        run: git diff --exit-code 71355fb4c18c7eefd2476b4a9b1dfaead799cdfb -- . ':!tests' ':!.github'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }} header-clearance.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: header-clearance-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
