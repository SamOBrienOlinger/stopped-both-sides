name: Verify approved Dublin character placement
on:
  push:
    branches: [uimproved]
    paths: [.github/workflows/import-approved-dublin.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.ref == 'refs/heads/uimproved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Match playable figures to foreground pedestrians
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/brand/approved-backgrounds.css');s=p.read_text()
          assert 'width:16%;left:auto' in s
          s=s.replace('width:16%;left:auto','width:28%;left:auto')
          s=s.replace('public{left:27%}','public{left:20%}').replace('garda{left:46%}','garda{left:36%}')
          s=s.replace('.scene-location[data-approved-art="bus-stop"]>.scene-actor{width:15%}\n','').replace('public{left:16%}','public{left:10%}').replace('garda{left:33%}','garda{left:28%}')
          s=s.replace('.scene-location[data-approved-art="quayside"]>.scene-actor{width:14%}\n','').replace('public{left:30%}','public{left:24%}').replace('garda{left:47%}','garda{left:42%}')
          p.write_text(s)
          p=Path('tests/browser/scenes.spec.mjs');s=p.read_text().replace('actor.outdoor ? .23 : .5','actor.outdoor ? .46 : .5').replace('actor.outdoor ? .30 : .6','actor.outdoor ? .51 : .6');p.write_text(s)
          p=Path('tests/browser/approved-backgrounds.spec.mjs');s=p.read_text().replace("'suburban-street',.27,.62","'suburban-street',.20,.64").replace("'bus-stop',.16,.48","'bus-stop',.10,.56").replace("'quayside',.30,.61","'quayside',.24,.70").replace('expect(a.height).toBeGreaterThan(.23)','expect(a.height).toBeGreaterThan(.46)').replace('expect(a.height).toBeLessThan(.30)','expect(a.height).toBeLessThan(.51)');p.write_text(s)
          for path in ['index.html','garda/index.html']:
           p=Path(path);s=p.read_text();assert 'approved-backgrounds.css?v=approved-dublin-2' in s
           p.write_text(s.replace('approved-backgrounds.css?v=approved-dublin-2','approved-backgrounds.css?v=approved-dublin-3'))
          PY
      - name: Check syntax and all game tests
        run: |
          npm run check | tee code-check.log
          npm test | tee game-tests.log
      - name: Prepare three browser engines
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify images, scale, pavement bounds, characters and game interaction
        run: npm run test:browser -- approved-backgrounds.spec.mjs scenes.spec.mjs characters.spec.mjs | tee browser-tests.log
      - name: Commit reviewed scale adjustment to uimproved only
        run: |
          test "$GITHUB_REF" = refs/heads/uimproved
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/approved-backgrounds.css tests/browser/scenes.spec.mjs tests/browser/approved-backgrounds.spec.mjs index.html garda/index.html
          git commit -m 'Match foreground character scale to approved Dublin scenes'
          git push origin HEAD:refs/heads/uimproved
          git rev-parse HEAD > integration-commit.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: approved-dublin-final-review
          path: |
            test-results/
            playwright-report/
            integration-commit.txt
            code-check.log
            game-tests.log
            browser-tests.log
            assets/brand/approved-backgrounds.css
          retention-days: 7
