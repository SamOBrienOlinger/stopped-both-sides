name: Browser compatibility

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Check the games]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  browser:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.browser }} layouts and play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # The built-in branch Pages workflow does not emit the expected follow-on
      # event here. Start after the game checks, then wait for this commit's Pages run.
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
