name: Shipping browser paint checks

on:
  push:
    branches: ['audit/platform-browsers-8047391']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-browsers:
    name: Installed ${{ matrix.browser }} on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit installed browser
        run: node scripts/hosted-browser-audit.mjs --browser ${{ matrix.browser }} --perf-runs 0 --output audit-results/${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-browser-audit-${{ matrix.browser }}
          path: audit-results/${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn

  safari:
    name: Installed Safari on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enable Safari automation
        run: sudo /usr/bin/safaridriver --enable
      - name: Audit installed Safari
        run: node scripts/hosted-browser-audit.mjs --browser safari --perf-runs 0 --output audit-results/safari
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-browser-audit-safari
          path: audit-results/safari
          retention-days: 7
          if-no-files-found: warn
