name: Mobile Safari keyboard audit
on:
  push:
    branches: ['audit/ios-keyboard-8047391*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 8047391c7921768c139d5a1443761983b481dce0
          path: pinned-site
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare iPhone Simulator and Appium
        run: |
          mkdir -p audit-results/ios
          xcodebuild -version
          xcrun simctl list devices available --json > audit-results/ios/devices.json
          info=$(node -e '
            const {devices}=require("./audit-results/ios/devices.json");
            const options=Object.entries(devices).filter(([r])=>r.includes("SimRuntime.iOS-"))
              .flatMap(([r,ds])=>ds.filter(d=>d.name.startsWith("iPhone")).map(d=>({d,r})));
            const rank=name=>/iPhone SE|mini/i.test(name)?0:/Plus|Max|Air/i.test(name)?2:1;
            options.sort((a,b)=>rank(a.d.name)-rank(b.d.name)||b.r.localeCompare(a.r,undefined,{numeric:true})||a.d.name.localeCompare(b.d.name));
            if(!options.length)throw Error("No installed iPhone simulator available");
            console.log(options[0].d.udid);')
          echo "IOS_UDID=$info" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$info" -b
          npm install --prefix "$RUNNER_TEMP/ios-appium" appium@4.0.1
          export APPIUM_HOME="$RUNNER_TEMP/ios-appium-home"
          "$RUNNER_TEMP/ios-appium/node_modules/.bin/appium" driver install xcuitest@13.8.0
          "$RUNNER_TEMP/ios-appium/node_modules/.bin/appium" driver list --installed
      - name: Measure Search in Mobile Safari
        timeout-minutes: 13
        run: |
          export APPIUM_HOME="$RUNNER_TEMP/ios-appium-home"
          "$RUNNER_TEMP/ios-appium/node_modules/.bin/appium" --address 127.0.0.1 --port 4723 --log-level info > audit-results/ios/appium.log 2>&1 &
          appium_pid=$!
          node pinned-site/tests/browser/server.mjs --port 4173 > audit-results/ios/server.log 2>&1 &
          site_pid=$!
          trap 'kill "$appium_pid" "$site_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:4723/status >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/stopped-both-sides/ >/dev/null
          node scripts/ios-safari-audit.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mobile-safari-simulator
          path: audit-results/ios/
          retention-days: 7
