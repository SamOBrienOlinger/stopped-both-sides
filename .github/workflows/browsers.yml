name: Mobile WebKit history baseline

on:
  push:
    branches: [verify/mobile-webkit-history-20261123]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-baseline:
    name: Characterize original mobile WebKit history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Assert original client files and exact revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Testing baseline verification commit $EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "31dac5e23e31a686bf48f4afcf96d95021bd742d"
          git diff --name-only HEAD^ HEAD > /tmp/baseline-changed-files
          node --input-type=module -e "import fs from 'node:fs'; const files=fs.readFileSync('/tmp/baseline-changed-files','utf8').trim().split('\n').sort(); const expected=['.github/workflows/browsers.yml','tests/browser/mobile-history-baseline.spec.mjs']; if(JSON.stringify(files)!==JSON.stringify(expected)) throw new Error('Unexpected client change: '+files); console.log('All client files exactly match 31dac5e23e31a686bf48f4afcf96d95021bd742d');"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Characterize native history
        run: npm run test:browser -- --project=webkit mobile-history-baseline.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: mobile-webkit-history-baseline
          path: |
            playwright-report/
            test-results/
          retention-days: 7
