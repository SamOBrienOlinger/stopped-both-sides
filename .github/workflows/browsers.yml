name: Browser compatibility

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Check the games]
    types: [completed]

permissions:
  contents: read
  actions: read

# A branch push and its PR update describe the same candidate. Keep only
# the newest branch run; retain each main publication's live verification.
concurrency:
  group: browsers-${{ github.event.workflow_run.head_sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  browser:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.browser }} layouts and play (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER_SUITE: general
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1/3
            artifact: chromium-1
          - browser: chromium
            shard: 2/3
            artifact: chromium-2
          - browser: chromium
            shard: 3/3
            artifact: chromium-3
          - browser: firefox
            shard: 1/3
            artifact: firefox-1
          - browser: firefox
            shard: 2/3
            artifact: firefox-2
          - browser: firefox
            shard: 3/3
            artifact: firefox-3
          - browser: webkit
            shard: 1/3
            artifact: webkit-1
          - browser: webkit
            shard: 2/3
            artifact: webkit-2
          - browser: webkit
            shard: 3/3
            artifact: webkit-3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Testing integration commit $EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Verify served bytes against this revision before testing production.
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Partition the general suite to stay within each job's
      # 30-minute budget. A failure must not cancel other verification/evidence.
      - run: npm run test:browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile-rendering:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.browser }} mobile refresh and first paint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Testing integration commit $EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Run first-paint and refresh coverage immediately, without waiting for
      # unrelated browser cases. The general shards exclude these same files.
      - name: Check mobile rendering and refresh
        run: npm run test:browser -- --project=${{ matrix.browser }} refresh-settlement.spec.mjs sitewide-rendering.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-mobile-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  landing-interactions:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Repeat landing interactions (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Repeated real interactions cover a race that only appeared after the
      # previous release. Main repeats them against the verified live files.
      - name: Repeat landing, saved-card and disclosure interactions
        run: >-
          npm run test:browser -- --project=webkit --repeat-each=3
          landing-motion-regressions.spec.mjs disclosure-pointer.spec.mjs
          portfolio-landing-reveal.spec.mjs refinements.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-landing-interactions
          path: |
            playwright-report/
            test-results/
          retention-days: 7
