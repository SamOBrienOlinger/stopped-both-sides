name: Browser compatibility

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Check the games]
    types: [completed]

permissions:
  contents: read
  actions: read

# A branch push and its PR update describe the same candidate. Keep only
# the newest branch run; retain each main publication's live verification.
concurrency:
  group: browsers-${{ github.event.workflow_run.head_sha || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  browser:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.browser }} layouts and play (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BROWSER_SUITE: general
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            shard: 1/3
            artifact: chromium-1
          - browser: chromium
            shard: 2/3
            artifact: chromium-2
          - browser: chromium
            shard: 3/3
            artifact: chromium-3
          - browser: firefox
            shard: 1/3
            artifact: firefox-1
          - browser: firefox
            shard: 2/3
            artifact: firefox-2
          - browser: firefox
            shard: 3/3
            artifact: firefox-3
          - browser: webkit
            shard: 1/3
            artifact: webkit-1
          - browser: webkit
            shard: 2/3
            artifact: webkit-2
          - browser: webkit
            shard: 3/3
            artifact: webkit-3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Testing integration commit $EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Verify served bytes against this revision before testing production.
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Partition the general suite to stay within each job's
      # 40-minute budget. A failure must not cancel other verification/evidence.
      - run: npm run test:browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-${{ matrix.artifact }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile-rendering:
    # Pages publishes independently of the core checks. Always exercise the
    # published mobile entrypoints, even if a separate core assertion failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    name: ${{ matrix.browser }} mobile layout, refresh and first paint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Testing integration commit $EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Run mobile layout, first-paint and refresh checks without waiting for
      # unrelated browser cases. The general shards exclude these same files.
      - name: Check mobile layout, rendering and refresh
        run: npm run test:browser -- --project=${{ matrix.browser }} mobile-landing.spec.mjs refresh-settlement.spec.mjs sitewide-rendering.spec.mjs
      - name: Repeat Firefox parser-time refresh at enlarged text
        if: matrix.browser == 'firefox'
        run: >-
          npm run test:browser -- --project=firefox --repeat-each=3
          --output=test-results/firefox-parser-repeat --reporter=list
          sitewide-rendering.spec.mjs
          --grep "garda small phone with enlarged text every page opening survives mobile refresh"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-mobile-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  scene-composition:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.browser }} character and prop grounding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check every cast composition and responsive ground contact
        run: npm run test:browser -- --project=${{ matrix.browser }} scene-grounding.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-scene-composition-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  landing-image-recovery:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: ${{ matrix.browser }} landing image recovery and controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # These engines can treat repeated hash-URL visits as same-document.
      # Exercise fresh cancellation/failure documents and both navigation
      # controls promptly; WebKit repeats the same cases in its landing job.
      - name: Repeat image recovery and navigation controls
        run: >-
          npm run test:browser -- --project=${{ matrix.browser }} --repeat-each=3
          portfolio-landing-reveal.spec.mjs remaining-controls.spec.mjs support.spec.mjs
          --grep "pending image cancellation and failure|previous-stage control|Back to Top|pending initial language"
      # The detached-animation failure was intermittent in Chromium. Stress
      # the exact regression independently of the general three repeats.
      - name: Stress interrupted landing animation cancellation (Chromium)
        if: matrix.browser == 'chromium'
        run: >-
          npm run test:browser -- --project=chromium --repeat-each=10
          --output=test-results/chromium-reveal-cancellation-repeat --reporter=list
          portfolio-landing-reveal.spec.mjs
          --grep "pending image cancellation and failure"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-image-recovery-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  landing-interactions:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: Repeat landing interactions (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_URL: ${{ github.event_name == 'workflow_run' && 'https://samobrienolinger.github.io/stopped-both-sides/' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
      - name: Assert exact code revision under test
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Wait for this Pages publication
        if: github.event_name == 'workflow_run'
        run: node tests/browser/wait-for-pages.mjs
        env:
          PAGES_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Repeated real interactions cover a race that only appeared after the
      # previous release. Main repeats them against the verified live files.
      - name: Repeat landing, saved-card and disclosure interactions
        run: >-
          npm run test:browser -- --project=webkit --repeat-each=3
          landing-motion-regressions.spec.mjs disclosure-pointer.spec.mjs
          portfolio-landing-reveal.spec.mjs refinements.spec.mjs remaining-controls.spec.mjs support.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: browser-report-landing-interactions
          path: |
            playwright-report/
            test-results/
          retention-days: 7
