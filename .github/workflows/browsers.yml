name: Shipping browser audit

on:
  push:
    branches: ['audit/platform-browsers-8047391*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-browsers:
    name: Installed ${{ matrix.browser }} on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit installed browser
        run: node scripts/hosted-browser-audit.mjs --browser ${{ matrix.browser }} --output audit-results/${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-browser-audit-${{ matrix.browser }}
          path: audit-results/${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn

  safari:
    name: Installed Safari on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enable Safari automation
        run: sudo /usr/bin/safaridriver --enable
      - name: Audit installed Safari
        run: node scripts/hosted-browser-audit.mjs --browser safari --output audit-results/safari
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-browser-audit-safari
          path: audit-results/safari
          retention-days: 7
          if-no-files-found: warn

  published-performance:
    name: Published cold-load measurements (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node hosted-perf-audit.mjs
      - name: Upload timing samples
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: published-cold-loads
          path: audit-results/performance.json
          retention-days: 7
