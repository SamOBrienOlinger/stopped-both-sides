name: Responsive fix verification

on:
  push:
    branches: ['audit/responsive-fix-check*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-browsers:
    name: Installed ${{ matrix.browser }} on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit installed browser
        run: node scripts/hosted-browser-audit.mjs --browser ${{ matrix.browser }} --perf-runs 0 --output audit-results/${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-browser-audit-${{ matrix.browser }}
          path: audit-results/${{ matrix.browser }}
          retention-days: 7
          if-no-files-found: warn

  safari:
    name: Installed Safari on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enable Safari automation
        run: sudo /usr/bin/safaridriver --enable
      - name: Audit installed Safari
        run: node scripts/hosted-browser-audit.mjs --browser safari --perf-runs 0 --output audit-results/safari
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-browser-audit-safari
          path: audit-results/safari
          retention-days: 7
          if-no-files-found: warn

  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Check narrow, breakpoint and ultrawide layouts
        run: node scripts/audit/matrix.cjs ${{ matrix.browser }}
      - name: Check nine language layouts
        if: always() && matrix.browser == 'chromium'
        run: node scripts/audit/languages.cjs chromium
      - name: Exercise mobile controls and keyboard contraction
        if: always()
        run: node scripts/audit/mobile.cjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: responsive-${{ matrix.browser }}
          path: audit-results/
          retention-days: 7
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node audit-timings.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: performance
          path: audit-results/performance.json
          retention-days: 7
