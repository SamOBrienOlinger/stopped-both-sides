name: Native Safari capture audit

on:
  push:
    branches: ['audit/platform-browsers-8047391']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-capture:
    name: Native Safari screen and WebDriver comparison
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enable the existing Safari WebDriver interface
        run: sudo /usr/bin/safaridriver --enable
      # No Screen Recording, Accessibility or TCC preferences are changed.
      # screencapture failures remain explicit in the artifact and job result.
      - name: Compare native screen and WebDriver captures
        run: >-
          node scripts/hosted-browser-audit.mjs --browser safari
          --profiles desktop,landscape --perf-runs 0 --capture-native
          --output audit-results/safari-capture
      - name: Upload captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: native-safari-capture-comparison
          path: audit-results/safari-capture
          retention-days: 7
          if-no-files-found: warn
