name: Safari static and site comparison

on:
  push:
    branches: ['audit/platform-browsers-8047391']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-control:
    name: Compare static control and site in Safari
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Enable Safari automation
        run: sudo /usr/bin/safaridriver --enable
      - name: Compare static control, Home and About
        run: node scripts/safari-control-compare.mjs --output audit-results/safari-control
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: safari-static-home-about-comparison
          path: audit-results/safari-control
          retention-days: 7
          if-no-files-found: warn
