name: Landing native press diagnostics
on:
  push:
    branches: [diagnostic/landing-render-20261123]
permissions:
  contents: read
jobs:
  diagnose:
    name: WebKit native press diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Verify unchanged candidate application
        run: git diff --exit-code 484bedf38c23f5ad957b6f711dad29a6473b8b02 -- app.mjs garda accessibility assets encounters
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:browser -- --project=webkit --repeat-each=5 landing-disclosure-diagnostic.spec.mjs
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: landing-native-press-diagnostic
          path: |
            playwright-report/
            test-results/
          retention-days: 7
