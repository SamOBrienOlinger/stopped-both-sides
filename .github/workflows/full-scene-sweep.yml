name: Exhaustive caption and scene sweep
on:
  push:
    branches: ['qa/scene-sweep-20261112']
    paths: ['.github/workflows/full-scene-sweep.yml', 'qa/**']
permissions:
  contents: read
concurrency:
  group: isolated-caption-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply uncommitted draft in this runner only
        run: |
          cp encounters/scenes.mjs encounters/scenes.baseline.mjs
          node qa/apply-caption-draft.mjs
          git diff > sweep-results/applied-changes.patch
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: All stages and all 81 pairings
        env:
          SWEEP_BROWSER: ${{ matrix.browser }}
          SWEEP_SHARD: ${{ matrix.shard }}
        run: node qa/scene-sweep.mjs | tee sweep-results/run.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sweep-${{ matrix.browser }}-${{ matrix.shard }}
          path: sweep-results/
          retention-days: 7
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node qa/apply-caption-draft.mjs
      - run: npm run check | tee sweep-results/syntax.log
      - run: npm test | tee sweep-results/game-tests.log
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Existing complete end-to-end regression suite
        run: npm run test:browser -- --project=${{ matrix.browser }} | tee sweep-results/regression.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: regression-${{ matrix.browser }}
          path: |
            sweep-results/
            test-results/
            playwright-report/
          retention-days: 7
