name: WebKit motion diagnosis
on:
  push:
    branches: [fix/captions-firefox-20261112]
    paths: [.github/workflows/webkit-motion-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: WebKit ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-traced, baseline-untraced, balanced, contained, prepared]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Isolate rendering variables without changing test expectations
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          variant=os.environ['VARIANT']
          if variant in ['balanced','contained','prepared']:
            p=Path('assets/brand/uimproved.css'); s=p.read_text()
            assert '--ui-reveal-ease:cubic-bezier(.22,1,.36,1);' in s
            p.write_text(s.replace('--ui-reveal-ease:cubic-bezier(.22,1,.36,1);','--ui-reveal-ease:cubic-bezier(.45,0,.55,1);'))
          if variant=='contained':
            p=Path('assets/brand/responsive-experience.css')
            p.write_text(p.read_text()+'\nmain details[data-disclosure-state]{contain:layout paint;}\n')
          if variant=='prepared':
            p=Path('accessibility/disclosures.mjs'); s=p.read_text()
            before='active.set(details,state);intent(state,open);\n  animation.onfinish=()=>finish(state);\n  animation.oncancel=()=>finish(state);\n  onStart(details);'
            after='animation.pause();animation.currentTime=0;\n  active.set(details,state);intent(state,open);\n  animation.onfinish=()=>finish(state);\n  animation.oncancel=()=>finish(state);\n  onStart(details);\n  requestAnimationFrame(()=>{if(active.get(details)===state&&state.animation===animation)animation.play();});'
            assert before in s
            p.write_text(s.replace(before,after))
          # Capture measured samples in CI output, with assertions unchanged.
          p=Path('tests/browser/motion-lifecycle.spec.mjs');s=p.read_text()
          s=s.replace('function expectPerceptibleFade(trace,kind,maximumStart,minimumElapsed){','function expectPerceptibleFade(trace,kind,maximumStart,minimumElapsed){\n console.log("FADE_TRACE",JSON.stringify({kind,trace}));')
          p.write_text(s)
          p=Path('tests/browser/responsive-experience.spec.mjs');s=p.read_text()
          s=s.replace('function expectGradualDisclosure(samples,before,opening){','function expectGradualDisclosure(samples,before,opening){\n console.log("DISCLOSURE_TRACE",JSON.stringify({samples,before,opening}));')
          p.write_text(s)
          PY
      - name: Exercise all four failing tests without weakening assertions
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          TRACE=on
          if [ "$VARIANT" = baseline-untraced ]; then TRACE=off; fi
          npm run test:browser -- motion-lifecycle.spec.mjs responsive-experience.spec.mjs --project=webkit --grep 'topic filters|stationary cards' --trace="$TRACE" 2>&1 | tee diagnosis.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: webkit-diagnosis-${{ matrix.variant }}
          path: |
            diagnosis.log
            test-results/
            playwright-report/
          retention-days: 7
