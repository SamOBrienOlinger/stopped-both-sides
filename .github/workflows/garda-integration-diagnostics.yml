name: Garda integration working-tree diagnostics
on:
  push:
    branches:
      - feat/garda-baseball-production-integration-20261114
  pull_request:
    branches: [main]
jobs:
  snapshot:
    if: github.head_ref == 'feat/garda-baseball-production-integration-20261114' || github.ref_name == 'feat/garda-baseball-production-integration-20261114'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Record exact commit and source tree
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "TREE_SHA=$(git rev-parse HEAD^{tree})"
      - name: Pack complete source tree for isolated local QA
        run: tar -czf /tmp/source-snapshot.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: garda-source-snapshot
          path: /tmp/source-snapshot.tar.gz
          retention-days: 2
