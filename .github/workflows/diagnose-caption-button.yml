name: Diagnose caption and Firefox button repair
on:
  push:
    branches: [fix/captions-firefox-20261112]
    paths: [.github/workflows/diagnose-caption-button.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Measure actual text and decorative overflow separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          cat > tests/browser/diagnose-button.spec.mjs <<'JS'
          import {test,expect} from '@playwright/test';
          import fs from 'node:fs';
          test('measure Firefox hero controls before and after removing decorative shine',async({page})=>{
            const results=[];
            await page.emulateMedia({reducedMotion:'reduce'});
            for(const width of [320,390,1366])for(const path of ['./','garda/']){
              await page.setViewportSize({width,height:900});
              await page.goto(path+'?lang=ga#play');
              await expect(page.locator('.perspective-hero-button')).toHaveCount(2);
              await page.evaluate(()=>document.fonts.ready);
              await page.evaluate(()=>document.documentElement.style.fontSize='150%');
              const measure=()=>page.locator('.perspective-hero-button').evaluateAll(els=>els.map(e=>{
                const b=e.getBoundingClientRect(),s=getComputedStyle(e),p=getComputedStyle(e,'::after');
                return {text:e.innerText,client:[e.clientWidth,e.clientHeight],scroll:[e.scrollWidth,e.scrollHeight],box:[b.x,b.y,b.width,b.height],style:{display:s.display,overflow:s.overflow,width:s.width,height:s.height},pseudo:{content:p.content,width:p.width,left:p.left,top:p.top,bottom:p.bottom,transform:p.transform},children:[...e.children].filter(c=>c.getClientRects().length).map(c=>{const r=c.getBoundingClientRect();return {text:c.innerText,box:[r.x,r.y,r.width,r.height],client:[c.clientWidth,c.clientHeight],scroll:[c.scrollWidth,c.scrollHeight]};})};
              }));
              const before=await measure();
              await page.addStyleTag({content:'.perspective-hero-button::after{content:none!important;display:none!important}'});
              const after=await measure();
              results.push({width,path,before,after});
              await page.locator('.reference-landing').screenshot({path:'repair-evidence/firefox-'+width+'-'+(path==='./'?'public':'garda')+'.png'});
            }
            fs.writeFileSync('repair-evidence/button-geometry.json',JSON.stringify(results,null,2));
            console.log('BUTTON_GEOMETRY '+JSON.stringify(results));
          });
          JS
          npx playwright test --config=tests/browser/playwright.config.mjs diagnose-button.spec.mjs --project=firefox --reporter=list
          rm tests/browser/diagnose-button.spec.mjs
          git archive --format=zip HEAD > repair-evidence/source-baseline.zip
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: caption-firefox-diagnosis
          path: repair-evidence/
          retention-days: 7
