name: Check the games

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check both perspectives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Static files are authored at the repository root; no build is needed.
      # Pages publishes main / (root) independently of this checks workflow.
      - run: npm run check
      - run: npm test
