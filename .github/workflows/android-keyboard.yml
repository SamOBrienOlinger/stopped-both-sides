name: Android native keyboard verification
on:
  push:
    branches: ['audit/native-android-ime-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_CASE_FILTER: public/ar/landscape
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 08f3c2c2fe736968fbd90bcaaafc2dfe4d466f3b
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Linux emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android browser and software keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/android-audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-keyboard
          path: android-results/
          retention-days: 14
