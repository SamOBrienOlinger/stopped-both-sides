name: Focused disclosure diagnostics

on:
  push:
    branches: [diagnostic/card-disclosure-20261123]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Assert diagnostic revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Compare disclosure containment and settled interaction
        run: npm run test:browser -- --project=webkit responsive-diagnostic.spec.mjs --reporter=list
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: disclosure-diagnostic-report
          path: test-results/
          retention-days: 7
